<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Prachi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --ink:#fff8f0;
  --muted:rgba(255,240,224,0.7);
  --soft:rgba(255,232,210,0.42);
  --line:rgba(255,232,210,0.2);
  --rose:#ff9db7;
  --peach:#ffc08a;
  --sky:#8fd6ff;
  --leaf:#91dfbd;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Outfit',sans-serif;
  -webkit-tap-highlight-color:transparent;
  background:#130d18;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 18%, rgba(255,157,183,0.26), transparent 30%),
    radial-gradient(circle at 80% 14%, rgba(143,214,255,0.2), transparent 28%),
    radial-gradient(circle at 50% 92%, rgba(255,192,138,0.24), transparent 34%),
    linear-gradient(145deg,#130d18 0%,#241427 45%,#332019 100%);
  transition:background 1s ease;
}

#canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

.glow{
  position:fixed;
  inset:auto auto -16vh 50%;
  width:92vw;
  height:38vh;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(255,192,138,0.25),transparent 68%);
  filter:blur(18px);
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;
  z-index:2;
  width:min(100%,390px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.mini-title{
  margin-bottom:10px;
  font-size:12px;
  letter-spacing:.08em;
  color:rgba(255,232,210,0.52);
  animation:fadeDown .8s .04s ease both;
}

.label{
  font-size:10px;
  letter-spacing:0.28em;
  text-transform:uppercase;
  color:rgba(255,232,210,0.58);
  margin-bottom:18px;
  font-weight:400;
  animation:fadeDown .8s ease both;
}

.meter{
  width:min(100%,330px);
  margin-bottom:14px;
  animation:fadeDown .8s .08s ease both;
}

.promises{
  width:min(100%,330px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:14px;
  animation:fadeDown .8s .12s ease both;
}

.promise{
  min-height:30px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,232,210,0.15);
  border-radius:999px;
  background:rgba(255,255,255,0.055);
  color:rgba(255,232,210,0.48);
  font-size:10px;
  letter-spacing:.11em;
  text-transform:uppercase;
  transition:background .35s,border-color .35s,color .35s,transform .35s;
}
.promise.lit{
  background:rgba(255,232,210,0.14);
  border-color:rgba(255,232,210,0.3);
  color:rgba(255,248,240,0.84);
  transform:translateY(-1px);
}

.meter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-size:11px;
  letter-spacing:.12em;
  color:rgba(255,232,210,0.56);
}

.meter-track{
  height:8px;
  border-radius:999px;
  border:1px solid rgba(255,232,210,0.17);
  background:rgba(255,255,255,0.07);
  overflow:hidden;
  box-shadow:inset 0 0 18px rgba(0,0,0,0.18);
}

.meter-fill{
  width:100%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--rose),var(--peach),var(--leaf));
  transform-origin:left center;
  transition:transform .65s cubic-bezier(.22,1,.36,1);
}

.counter{
  min-height:16px;
  margin-bottom:14px;
  font-size:11px;
  letter-spacing:.15em;
  color:rgba(255,232,210,0.5);
  transition:opacity .35s;
}

.scene{
  width:min(100%,330px);
  height:390px;
  perspective:1000px;
  margin-bottom:18px;
  animation:rise .9s .16s ease both;
}

.flipper{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .72s cubic-bezier(.4,.2,.2,1),filter .45s;
}
.flipper.flipped{transform:rotateX(var(--rx,0deg)) rotateY(calc(180deg + var(--ry,0deg)));}

.face{
  position:absolute;
  inset:0;
  border-radius:26px;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(0,0,0,0.28);
}

.front{
  justify-content:center;
  align-items:center;
  padding:34px 28px;
  cursor:pointer;
  background:
    linear-gradient(145deg,rgba(255,255,255,0.14),rgba(255,255,255,0.04)),
    radial-gradient(circle at 25% 18%,rgba(255,157,183,0.25),transparent 36%),
    radial-gradient(circle at 76% 82%,rgba(143,214,255,0.16),transparent 34%);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}

.front::before,.back::before{
  content:'';
  position:absolute;
  inset:1px;
  border-radius:25px;
  background:linear-gradient(135deg,rgba(255,255,255,0.22),transparent 42%);
  pointer-events:none;
}

.front::after,.back::after{
  content:'';
  position:absolute;
  inset:-40% -60%;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,0.16),transparent 58%);
  transform:translateX(-45%) rotate(8deg);
  opacity:.52;
  pointer-events:none;
  animation:shine 5.5s ease-in-out infinite;
}

.front > *,.back > *{
  position:relative;
  z-index:1;
}

.moon{
  width:88px;
  height:88px;
  border-radius:50%;
  margin-bottom:24px;
  background:
    radial-gradient(circle at 36% 31%,rgba(255,255,255,0.9) 0 4px,transparent 5px),
    radial-gradient(circle at 61% 57%,rgba(255,255,255,0.45) 0 6px,transparent 7px),
    linear-gradient(145deg,#fff3cf,#ffb7c9 58%,#9bdcff);
  box-shadow:0 0 28px rgba(255,183,201,0.42),0 0 80px rgba(143,214,255,0.25);
  animation:breathe 3s ease-in-out infinite;
}

.front-title{
  font-family:'Playfair Display',serif;
  font-size:31px;
  line-height:1.16;
  font-weight:600;
  color:rgba(255,248,240,0.96);
  margin-bottom:12px;
}

.front-hint{
  font-size:12px;
  letter-spacing:.14em;
  color:rgba(255,232,210,0.6);
  text-transform:uppercase;
}

.seal{
  position:absolute;
  right:23px;
  bottom:22px;
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,232,210,0.28);
  color:rgba(255,248,240,0.74);
  font-family:'Playfair Display',serif;
  font-size:18px;
  background:rgba(255,255,255,0.08);
}

.back{
  padding:28px 25px 22px;
  text-align:left;
  background:
    linear-gradient(145deg,rgba(255,255,255,0.13),rgba(255,255,255,0.045)),
    radial-gradient(circle at 70% 8%,rgba(255,192,138,0.22),transparent 36%),
    rgba(31,20,33,0.72);
  transform:rotateY(180deg);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}

.card-num{
  position:relative;
  z-index:1;
  font-size:10px;
  letter-spacing:.22em;
  color:rgba(255,232,210,0.52);
  text-transform:uppercase;
}

.card-body{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  align-items:center;
  padding:20px 0 14px;
}

.card-text{
  font-family:'Playfair Display',serif;
  font-size:18px;
  line-height:1.82;
  color:rgba(255,248,240,0.94);
  font-weight:400;
}

.card-text::before{
  content:'"';
  display:block;
  height:26px;
  margin-bottom:4px;
  font-size:48px;
  line-height:.7;
  color:rgba(255,192,138,0.38);
}

.card-foot{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  font-size:10px;
  letter-spacing:.12em;
  color:rgba(255,232,210,0.43);
  text-transform:uppercase;
}

.btns{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  margin-bottom:14px;
  animation:rise .8s .28s ease both;
}

.btn{
  border:1px solid rgba(255,232,210,0.24);
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  outline:none;
  transition:transform .14s,background .18s,border-color .18s;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.btn:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,232,210,0.38);}
.btn:active{transform:scale(.9);}
.btn-sm{width:46px;height:46px;}
.btn-lg{width:62px;height:62px;}

.btn-lg.ready{
  box-shadow:0 0 0 8px rgba(255,192,138,0.08),0 0 34px rgba(255,192,138,0.18);
}

.btn-label{
  margin-bottom:15px;
  font-size:10px;
  letter-spacing:.12em;
  color:rgba(255,232,210,0.42);
  animation:rise .8s .34s ease both;
}

.dots{
  display:flex;
  gap:8px;
  justify-content:center;
  animation:rise .8s .4s ease both;
}
.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,232,210,0.2);
  transition:background .35s,transform .35s,width .35s;
}
.dot.done{background:rgba(145,223,189,0.86);transform:scale(1.18);}
.dot.current{width:18px;background:rgba(255,192,138,0.82);}

.done{
  display:none;
  min-height:390px;
  width:min(100%,330px);
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:16px;
}
.done.show{display:flex;animation:rise .8s ease both;}

.done-ring{
  width:92px;
  height:92px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin-bottom:22px;
  border:1px solid rgba(255,232,210,0.25);
  background:radial-gradient(circle,rgba(255,255,255,0.16),rgba(255,255,255,0.06));
  box-shadow:0 0 42px rgba(145,223,189,0.24);
  animation:pop .65s cubic-bezier(.34,1.56,.64,1) both;
}

.done-title{
  font-family:'Playfair Display',serif;
  font-size:27px;
  line-height:1.18;
  color:rgba(255,248,240,0.96);
  margin-bottom:12px;
}

.done-sub{
  font-family:'Playfair Display',serif;
  font-size:15px;
  font-style:italic;
  line-height:1.9;
  color:rgba(255,232,210,0.72);
  margin-bottom:18px;
}

.after-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.secret-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:0 18px;
  border-radius:999px;
  border:1px solid rgba(255,232,210,0.24);
  color:rgba(255,248,240,0.88);
  text-decoration:none;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  background:rgba(255,255,255,0.08);
  transition:background .18s,transform .18s;
}
.secret-link:hover{background:rgba(255,255,255,0.14);}
.secret-link:active{transform:scale(.96);}

.ghost-btn{
  min-height:42px;
  padding:0 16px;
  border:1px solid rgba(255,232,210,0.2);
  border-radius:999px;
  color:rgba(255,248,240,0.72);
  background:rgba(255,255,255,0.05);
  font:500 12px 'Outfit',sans-serif;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
}

.soft-note{
  position:fixed;
  left:50%;
  top:50%;
  z-index:4;
  color:rgba(255,248,240,0.92);
  font-family:'Playfair Display',serif;
  font-size:18px;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-50%) scale(.92);
}
.soft-note.show{animation:softNote .9s ease both;}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes breathe{0%,100%{transform:scale(1);filter:saturate(1);}50%{transform:scale(1.05);filter:saturate(1.16);}}
@keyframes pop{from{opacity:0;transform:scale(.55);}to{opacity:1;transform:scale(1);}}
@keyframes shine{0%,45%{transform:translateX(-45%) rotate(8deg);}65%,100%{transform:translateX(45%) rotate(8deg);}}
@keyframes softNote{0%{opacity:0;transform:translate(-50%,-35%) scale(.92);}18%{opacity:1;}100%{opacity:0;transform:translate(-50%,-92%) scale(1.08);}}

@media (max-height:720px){
  body{padding:12px;}
  .label{margin-bottom:10px;}
  .meter{margin-bottom:10px;}
  .promises{margin-bottom:10px;}
  .counter{margin-bottom:10px;}
  .scene,.done{height:340px;min-height:340px;}
  .front-title{font-size:27px;}
  .card-text{font-size:16px;line-height:1.72;}
  .btns{margin-bottom:10px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="glow"></div>

<main class="wrap">
  <p class="label">gussa halka karne wali jagah</p>
  <p class="mini-title">a tiny repair attempt</p>

  <div class="meter" aria-hidden="true">
    <div class="meter-row">
      <span>anger</span>
      <span id="meterText">melting...</span>
    </div>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
  </div>

  <div class="promises" aria-hidden="true">
    <span class="promise" id="promise1">sorry</span>
    <span class="promise" id="promise2">space</span>
    <span class="promise" id="promise3">care</span>
  </div>

  <p class="counter" id="counter">tap the moon </p>

  <section class="scene" id="scene" aria-live="polite">
    <div class="flipper" id="flipper">
      <button class="face front" id="front" type="button" onclick="flipCard()" aria-label="open message">
        <span class="moon" aria-hidden="true"></span>
        <span class="front-title">Prachi,<br>thoda sa sunogi?</span>
        <span class="front-hint">tap the moon</span>
        <span class="seal" aria-hidden="true">P</span>
      </button>

      <article class="face back">
        <span class="card-num" id="cnum"></span>
        <div class="card-body"><p class="card-text" id="ctext"></p></div>
        <div class="card-foot">
          <span id="tone">softly</span>
          <span>next</span>
        </div>
      </article>
    </div>
  </section>

  <section class="done" id="done" aria-live="polite">
    <div class="done-ring" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgba(255,248,240,0.92)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7-4.35-9.33-8.37C.6 9.05 2.73 5 6.63 5c2.02 0 3.28 1.02 3.99 2.03C11.33 6.02 12.59 5 14.61 5c3.9 0 6.03 4.05 3.96 7.63C16.24 16.65 12 21 12 21z"/>
      </svg>
    </div>
    <p class="done-title">Agar smile aa gayi,<br>to mission complete.</p>
    <p class="done-sub">Gussa valid tha. Main bas better handle kar sakta tha.<br>No pressure, bas sorry.</p>
    <div class="after-actions">
      <button class="ghost-btn" type="button" onclick="restart()">read again</button>
      <a one tiny extra</a>
    </div>
  </section>

  <div id="btns-wrap">
    <div class="btns">
      <button class="btn btn-sm" onclick="prevCard()" aria-label="previous message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,248,240,0.86)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="btn btn-lg" id="nextBtn" onclick="nextCard()" aria-label="next message">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,248,240,0.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>
    <p class="btn-label">prev / next</p>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
</main>
<div class="soft-note" id="softNote">softly</div>

<script>
const cv=document.getElementById('canvas');
const cx=cv.getContext('2d');
let W=0,H=0,particles=[];

function resize(){
  const scale=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  cv.width=Math.floor(W*scale);
  cv.height=Math.floor(H*scale);
  cv.style.width=W+'px';
  cv.style.height=H+'px';
  cx.setTransform(scale,0,0,scale,0,0);
}

function seedParticles(){
  particles=Array.from({length:95},()=>({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*2.2+0.5,
    a:Math.random()*0.45+0.16,
    drift:Math.random()*0.28+0.08,
    phase:Math.random()*Math.PI*2,
    hue:Math.random()
  }));
}

function draw(){
  cx.clearRect(0,0,W,H);
  particles.forEach(p=>{
    p.phase+=0.012;
    p.y-=p.drift;
    p.x+=Math.sin(p.phase)*0.18;
    if(p.y<-8){p.y=H+8;p.x=Math.random()*W;}
    const alpha=p.a*(0.55+0.45*Math.sin(p.phase));
    const color=p.hue<.34?'255,157,183':p.hue<.67?'255,192,138':'143,214,255';
    cx.beginPath();
    cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=`rgba(${color},${alpha})`;
    cx.fill();
  });
  requestAnimationFrame(draw);
}

resize();
seedParticles();
window.addEventListener('resize',()=>{resize();seedParticles();});
draw();

const msgs=[
  {n:'01 / 06',tone:'sorry',t:'Mujhe realise hua ki jab main hurt ya confused tha, meri baat tumhare liye heavy ban gayi. Uske liye sorry. Hamesha yahi ho jata h mere se'},
  {n:'02 / 06',tone:'no pressure',t:'Agar tum gusse me ho, Tumhara gussa galat nahi. Agar meri wajah se tum uncomfortable hui, to pehle main us feeling ko respect karta hu.'},
  {n:'03 / 06',tone:'truth',t:'Main answers ke chakkar me softness bhool gaya. Mujhe tumse ladna nahi tha, bas apni anxiety ko samajhna tha.'},
  {n:'04 / 06',tone:'care',t:'Tum princess ho isliye nahi ki main ordinary hu. Tum special ho, aur mujhe apni baat bhi special tareeke se rakhni chahiye thi.'},
  {n:'05 / 06',tone:'promise',t:'Aage se main pressure nahi banaunga. Jo bhi baat hogi, calmly, clearly, aur tumhari space ka dhyaan rakh ke karunga.'},
  {n:'06 / 06',tone:'smile?',t:'Bas itna: sorry for making it heavy. Agar possible ho, to kal ka gussa thoda sa dissolve karke ek tiny smile de dena.'},
  {n:'07 / 06',tone:'smile?',t:'Badmosh ho tum, lekin bholi or cute bhi ho. Or koi bhi cheez mujhe tumhari tareef karne se nhi rok sakti!'}
];

let cur=0;
let revealed=false;
const flipper=document.getElementById('flipper');
const scene=document.getElementById('scene');
const front=document.getElementById('front');
const cnum=document.getElementById('cnum');
const ctext=document.getElementById('ctext');
const tone=document.getElementById('tone');
const counter=document.getElementById('counter');
const dotsEl=document.getElementById('dots');
const meterFill=document.getElementById('meterFill');
const meterText=document.getElementById('meterText');
const nextBtn=document.getElementById('nextBtn');
const softNote=document.getElementById('softNote');
const promises=[document.getElementById('promise1'),document.getElementById('promise2'),document.getElementById('promise3')];
const notes=['I heard you','space first','softly','no pressure','carefully','tiny smile?'];

msgs.forEach((_,i)=>{
  const d=document.createElement('span');
  d.className='dot'+(i===0?' current':'');
  dotsEl.appendChild(d);
});

function loadCard(i){
  cnum.textContent=msgs[i].n;
  ctext.textContent=msgs[i].t;
  tone.textContent=msgs[i].tone;
  counter.textContent=(i+1)+' / '+msgs.length;
  updateDots();
  updateMeter();
}

function flipCard(){
  if(revealed)return;
  revealed=true;
  loadCard(cur);
  flipper.classList.add('flipped');
  popNote('slowly');
}

function nextCard(){
  if(!revealed){flipCard();return;}
  if(cur>=msgs.length-1){
    popNote('thank you');
    setTimeout(showDone,260);
    return;
  }
  turnTo(cur+1);
}

function prevCard(){
  if(!revealed||cur<=0)return;
  turnTo(cur-1);
}

function turnTo(next){
  flipper.classList.remove('flipped');
  nextBtn.classList.remove('ready');
  revealed=false;
  setTimeout(()=>{
    cur=next;
    loadCard(cur);
    setTimeout(()=>{
      flipper.classList.add('flipped');
      revealed=true;
      nextBtn.classList.add('ready');
      popNote(notes[cur]);
    },80);
  },340);
}

function updateDots(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot'+(i<cur?' done':i===cur?' current':'');
  });
}

function updateMeter(){
  const left=Math.max(0,1-(cur+1)/msgs.length);
  meterFill.style.transform=`scaleX(${left})`;
  meterText.textContent=left<=0?'gone':left<.35?'almost gone':'melting...';
  promises.forEach((p,i)=>p.classList.toggle('lit',cur>=i*2));
  nextBtn.classList.toggle('ready',revealed);
}

function showDone(){
  document.getElementById('scene').style.display='none';
  document.getElementById('btns-wrap').style.display='none';
  counter.style.opacity='0';
  meterFill.style.transform='scaleX(0)';
  meterText.textContent='gone';
  promises.forEach(p=>p.classList.add('lit'));
  document.getElementById('done').classList.add('show');
  bloom();
}

function restart(){
  cur=0;
  revealed=false;
  document.getElementById('done').classList.remove('show');
  document.getElementById('scene').style.display='block';
  document.getElementById('btns-wrap').style.display='block';
  counter.style.opacity='1';
  flipper.classList.remove('flipped');
  nextBtn.classList.remove('ready');
  loadCard(0);
  popNote('again, gently');
}

function popNote(text){
  softNote.textContent=text;
  softNote.classList.remove('show');
  void softNote.offsetWidth;
  softNote.classList.add('show');
}

function bloom(){
  for(let i=0;i<34;i++){
    particles.push({
      x:W/2+(Math.random()-.5)*80,
      y:H/2+(Math.random()-.5)*80,
      r:Math.random()*2.8+1,
      a:Math.random()*0.55+0.28,
      drift:Math.random()*1.1+0.45,
      phase:Math.random()*Math.PI*2,
      hue:Math.random()
    });
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();nextCard();}
  if(e.key==='ArrowLeft'){e.preventDefault();prevCard();}
});

scene.addEventListener('pointermove',e=>{
  const rect=scene.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width-.5;
  const y=(e.clientY-rect.top)/rect.height-.5;
  flipper.style.setProperty('--ry',(x*7).toFixed(2)+'deg');
  flipper.style.setProperty('--rx',(-y*6).toFixed(2)+'deg');
});

scene.addEventListener('pointerleave',()=>{
  flipper.style.setProperty('--ry','0deg');
  flipper.style.setProperty('--rx','0deg');
});

loadCard(0);
</script>
</body>
</html>
