<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Prachi</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            --bw: clamp(240px, 85vw, 300px);
            height: 100vh;
            background: #1a1208;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            overflow: hidden;
        }

        /* ── AMBIENT CANVAS ── */
        #ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── WARM SPOTLIGHT ── */
        .spotlight {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 400px;
            background: radial-gradient(ellipse 50% 45%, rgba(200, 150, 100, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── BOX ── */
        .box {
            position: relative;
            width: var(--bw);
            cursor: pointer;
            user-select: none;
            transition: filter 0.5s ease, transform 0.6s ease;
            z-index: 2;
        }

        .box:hover {
            transform: translateY(-2px);
        }

        /* table shadow */
        .box::after {
            content: '';
            position: absolute;
            bottom: calc(var(--bw) * -12 / 300);
            left: 10%;
            right: 10%;
            height: calc(var(--bw) * 16 / 300);
            background: radial-gradient(ellipse 90% 100% at 50% 0%, rgba(0, 0, 0, 0.45), transparent);
            filter: blur(5px);
            border-radius: 50%;
            transition: opacity 0.5s ease;
        }

        .lid {
            width: 100%;
            height: calc(var(--bw) * 44 / 300);
            background:
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px, transparent 18px),
                linear-gradient(180deg, #8B5E3C, #6B4423, #5a3518);
            border-radius: 6px 6px 2px 2px;
            border: 1px solid #3d2008;
            border-bottom: 2px solid #2c1806;
            box-shadow: inset 0 2px 4px rgba(255, 200, 120, 0.12), inset 0 -2px 4px rgba(0, 0, 0, 0.4), 0 -2px 8px rgba(0, 0, 0, 0.5);
            transform-origin: top;
            transition: transform 1s cubic-bezier(.2, .8, .2, 1);
            position: relative;
            z-index: 10;
        }

        /* gold clasp */
        .lid::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--bw) * 22 / 300);
            height: calc(var(--bw) * 6 / 300);
            background: radial-gradient(ellipse, #c8903a, #8a5c1e);
            border-radius: 3px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5), 0 0 6px rgba(200, 150, 80, 0.15);
        }

        /* gold inlay line on lid */
        .lid::before {
            content: '';
            position: absolute;
            inset: calc(var(--bw) * 6 / 300) calc(var(--bw) * 20 / 300);
            border: 0.5px solid rgba(200, 160, 80, 0.15);
            border-radius: 2px;
            pointer-events: none;
        }

        .base {
            width: 100%;
            height: calc(var(--bw) * 160 / 300);
            background:
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px, transparent 18px),
                linear-gradient(180deg, #6B4423, #5a3518, #4a2c12);
            border-radius: 2px 2px 8px 8px;
            border: 1px solid #3d2008;
            border-top: none;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5), inset 2px 0 6px rgba(0, 0, 0, 0.3), inset -2px 0 6px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .interior {
            position: absolute;
            inset: calc(var(--bw) * 8 / 300) calc(var(--bw) * 8 / 300) 0;
            background: radial-gradient(ellipse at 50% 20%, #3d0d18, #1f060d);
            border-radius: 2px 2px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* soft inner glow when open */
            box-shadow: inset 0 0 25px rgba(180, 40, 80, 0.08);
        }

        /* ── CAROUSEL ── */
        .stage {
            width: calc(var(--bw) * 220 / 300);
            height: calc(var(--bw) * 130 / 300);
            transform-style: preserve-3d;
            animation: spin 18s linear infinite;
            opacity: 0;
            transition: opacity 0.8s ease 0.3s;
        }

        .stage:hover {
            animation-play-state: paused
        }

        @keyframes spin {
            from {
                transform: rotateY(0)
            }

            to {
                transform: rotateY(360deg)
            }
        }

        .card {
            position: absolute;
            width: calc(var(--bw) * 140 / 300);
            left: 50%;
            top: 50%;
            margin-left: calc(var(--bw) * -70 / 300);
            margin-top: calc(var(--bw) * -52 / 300);
            height: calc(var(--bw) * 104 / 300);
            border-radius: 6px;
            background: rgba(253, 248, 240, 0.93);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--bw) * 14 / 300);
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(200, 160, 100, 0.1);
            cursor: pointer;
            transition: box-shadow 0.3s ease;
            backface-visibility: hidden;
        }

        .card:hover {
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.7), 0 0 12px rgba(200, 150, 80, 0.1);
        }

        .card span {
            font-family: 'Cormorant Garamond', serif;
            font-size: calc(var(--bw) * 13.5 / 300);
            font-weight: 300;
            font-style: italic;
            color: #2a1a10;
            line-height: 1.55;
            pointer-events: none;
        }

        .card:nth-child(1) {
            transform: rotateY(0deg) translateZ(calc(var(--bw) * 120 / 300))
        }

        .card:nth-child(2) {
            transform: rotateY(60deg) translateZ(calc(var(--bw) * 120 / 300))
        }

        .card:nth-child(3) {
            transform: rotateY(120deg) translateZ(calc(var(--bw) * 120 / 300))
        }

        .card:nth-child(4) {
            transform: rotateY(180deg) translateZ(calc(var(--bw) * 120 / 300))
        }

        .card:nth-child(5) {
            transform: rotateY(240deg) translateZ(calc(var(--bw) * 120 / 300))
        }

        .card:nth-child(6) {
            transform: rotateY(300deg) translateZ(calc(var(--bw) * 120 / 300))
        }

        /* open lid */
        .box.open .lid {
            transform: rotateX(-130deg) translateY(calc(var(--bw) * -10 / 300))
        }

        .box.open .stage {
            opacity: 1
        }

        /* blur box when a card is focused */
        .box.blurred {
            filter: blur(6px);
            pointer-events: none
        }

        .hint {
            margin-top: calc(var(--bw) * 22 / 300);
            font-size: clamp(10px, 3.5vw, 11px);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(255, 200, 140, 0.28);
            font-weight: 300;
            transition: filter 0.5s ease, opacity 0.5s ease;
            z-index: 2;
            animation: hintPulse 3s ease-in-out infinite;
        }

        @keyframes hintPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .hint.blurred {
            filter: blur(6px);
            opacity: 0.3
        }

        /* ── FLOATING NOTES ── */
        .note {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            font-size: 1rem;
            color: rgba(200, 150, 100, 0.3);
            animation: noteFloat linear forwards;
        }

        @keyframes noteFloat {
            0% {
                opacity: 0.6;
                transform: translateY(0) translateX(0) rotate(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-110px) translateX(var(--dx)) rotate(var(--rot));
            }
        }

        /* ── FOCUS OVERLAY ── */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* dark blur behind the expanded card */
        .overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 7, 3, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .expanded-card {
            position: relative;
            z-index: 1;
            width: clamp(260px, 90vw, 360px);
            max-height: 85vh;
            overflow-y: auto;
            background: #fdfaf4;
            border-radius: 12px;
            padding: clamp(24px, 8vw, 36px) clamp(20px, 6vw, 32px) clamp(24px, 8vw, 34px);
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 200, 140, 0.12), 0 0 60px rgba(200, 130, 80, 0.06);
            transform: scale(0.88) translateY(16px);
            transition: transform 0.45s cubic-bezier(.2, .8, .2, 1);
        }

        .overlay.active .expanded-card {
            transform: scale(1) translateY(0);
        }

        .expanded-card .rule {
            width: 40px;
            height: 0.5px;
            background: rgba(180, 120, 90, 0.35);
            margin: 0 auto 22px;
        }

        .expanded-card .full-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(17px, 5.5vw, 22px);
            font-weight: 300;
            font-style: italic;
            color: #2a1510;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .expanded-card .rule-bottom {
            width: 24px;
            height: 0.5px;
            background: rgba(180, 90, 90, 0.3);
            margin: 22px auto 0;
        }

        .close-btn {
            position: absolute;
            top: 13px;
            right: 16px;
            font-size: 16px;
            color: rgba(80, 45, 30, 0.28);
            cursor: pointer;
            font-weight: 300;
            line-height: 1;
            transition: color 0.2s;
            font-family: 'Lato', sans-serif;
        }

        .close-btn:hover {
            color: rgba(80, 45, 30, 0.65)
        }
    </style>
</head>

<body>

    <canvas id="ambient"></canvas>
    <div class="spotlight"></div>

    <!-- Sound effects generated via Web Audio API -->

    <div class="box" id="box">
        <div class="lid"></div>
        <div class="base">
            <div class="interior">
                <div class="stage" id="stage">
                    <div class="card"
                        data-full="Prachiiiee, I know you might be feeling exhausted, bs ye socho ki energy bekar nhi jaati, returns jaroor milenge kisi na kisi form me, kabhi kabhi bs tumko test kiya jaata h. kabhi kabhi tumko prepare kiya jaata h. Mentally or emotionally. Tumhari care tumhe wapis jaroor milegi multiply hoke,bhale form change ho jaaye.... I can assure this, tumhe filhal bs khush khush mst mst rehna h!">
                        <span>🫶You'll Get Everything you deserve 🫶</span>
                    </div>
                    <div class="card"
                        data-full="Tumhe kabhi bhi kisi se approval nhi chahiye hota h, bs apne mann ki krti ho, or ye baat mujhe bahut pasnd h. ">
                        <span>🫵You do things quietly — and they stay🫵</span>
                    </div>
                    <div class="card"
                        data-full="There's a consistency in you that most people spend their whole lives chasing. You already have it. Cherish your heart that looks hard and cold but actually softer than anyone can understand. Work hard but do not let the prachiiiee burnout.">
                        <span>🎐Your consistency is something rare🎐</span>
                    </div>
                    <div class="card"
                        data-full="I know you're damnnn strong. Lot more patient, hard. But there is a little girl inside you who needs a lil appreciation. Soooooo... in case no body gives you that, I'm here to give you that. You are Cabale of everything, just believe in yourself. spelling jaan ke galat likhi h 😁">
                        <span>🎀And this thing is defenately to cheer you up🎀</span>
                    </div>
                    <div class="card"
                        data-full="You deserve every soft thing this world has — slow mornings, warm words, people who actually notice you. And your efforts that needs  to be noticed. And doing all those things without expectations, uhhhhhh i'm proud of you prachiiee 🎀 You are exactly the innocent girl with a heart of gold 🎀 Actual girly girl 🎀 caring , emotional, sensitive bs gusse me (abhi kuch bolunga to me gaya 👾 baad me baad meee, ye cheez pause pe rahegi)">
                        <span>🪽You deserve every soft thing🪽</span>
                    </div>
                    <div class="card"
                        data-full="Hard time hai tumhare liye, collage exams ko bhi abhi ana tha 😤 chalo tum sambhal logi I know. Yahi h ki bohot jyda stress mt lena, thoda break le lena, time kharab naa ho isiliye ispe bhi koi reaction de dena tum too..., Off feel ho to text kar lena(ye mat sochna me busy hounga... Prachiiieee ke liye to me 24 ghante free hu. Aur mujhe accaha bhi lagta h), you'll make it.. Just be gentle with yourself, You are Capable Trust me!!">
                        <span>💛Yes You'll make it..!!💛</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="hint" id="hint">open</div>

    <!-- expanded card overlay -->
    <div class="overlay" id="overlay">
        <div class="expanded-card">
            <span class="close-btn" id="close-btn">✕</span>
            <div class="rule"></div>
            <div class="full-text" id="full-text"></div>
            <div class="rule-bottom"></div>
        </div>
    </div>

    <script>
        const box = document.getElementById('box');
        const stage = document.getElementById('stage');
        const overlay = document.getElementById('overlay');
        const fullTxt = document.getElementById('full-text');
        const hint = document.getElementById('hint');
        const closeBtn = document.getElementById('close-btn');

        // ═══ AMBIENT CANVAS — warm dust motes ═══
        const cvs = document.getElementById('ambient');
        const ctx = cvs.getContext('2d');
        let motes = [], t = 0;

        function resize() {
            cvs.width = innerWidth;
            cvs.height = innerHeight;
            buildMotes();
        }
        window.addEventListener('resize', resize);

        function buildMotes() {
            motes = [];
            for (let i = 0; i < 50; i++) {
                motes.push({
                    x: Math.random() * cvs.width,
                    y: Math.random() * cvs.height,
                    r: 0.3 + Math.random() * 0.5,
                    a: Math.random() * 0.2 + 0.02,
                    ph: Math.random() * Math.PI * 2,
                    sp: 0.1 + Math.random() * 0.2,
                    vx: (Math.random() - 0.5) * 0.04,
                    vy: -(Math.random() * 0.03 + 0.008)
                });
            }
        }

        function drawAmbient() {
            const w = cvs.width, h = cvs.height;
            t += 0.006;
            ctx.clearRect(0, 0, w, h);

            // vignette
            const vg = ctx.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.7);
            vg.addColorStop(0, 'rgba(26,18,8,0)');
            vg.addColorStop(0.7, 'rgba(14,10,4,0.3)');
            vg.addColorStop(1, 'rgba(8,5,2,0.7)');
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, w, h);

            // dust motes
            motes.forEach(p => {
                p.x += p.vx + Math.sin(t * p.sp + p.ph) * 0.03;
                p.y += p.vy;
                if (p.y < -3) { p.y = h + 3; p.x = Math.random() * w; }
                const alpha = p.a * (0.5 + 0.5 * Math.sin(t * p.sp + p.ph));
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220,180,140,${alpha})`;
                ctx.fill();
            });

            requestAnimationFrame(drawAmbient);
        }

        resize();
        drawAmbient();

        // ═══ FLOATING MUSIC NOTES ═══
        const NOTES = ['♩', '♪', '♫', '♬'];
        let noteInt;
        function floatNote() {
            const n = document.createElement('div');
            n.className = 'note';
            const boxRect = box.getBoundingClientRect();
            const cx = boxRect.left + boxRect.width / 2;
            const cy = boxRect.top;
            n.textContent = NOTES[~~(Math.random() * NOTES.length)];
            const dx = (Math.random() - 0.5) * 50;
            const rot = (Math.random() - 0.5) * 30 + 'deg';
            const dur = 1.5 + Math.random() * 1;
            n.style.cssText = `left:${cx + (Math.random() - 0.5) * 60}px;top:${cy}px;--dx:${dx}px;--rot:${rot};animation-duration:${dur}s;`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), (dur + 0.1) * 1000);
        }
        function startNotes() { if (!noteInt) noteInt = setInterval(floatNote, 2200); }

        // ═══ WEB AUDIO — Sound Effects & Music Box Melody ═══
        let AC = null;
        function getAC() {
            if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
            if (AC.state === 'suspended') AC.resume();
            return AC;
        }

        // Reverb for that music-box-in-a-room feel
        let _rev = null;
        function getRev() {
            if (_rev) return _rev;
            const c = getAC(), sr = c.sampleRate, buf = c.createBuffer(2, sr * 3, sr);
            for (let ch = 0; ch < 2; ch++) {
                const d = buf.getChannelData(ch);
                for (let i = 0; i < buf.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / buf.length, 4) * 0.4;
            }
            const cv = c.createConvolver(); cv.buffer = buf;
            const g = c.createGain(); g.gain.value = 0.2;
            cv.connect(g); g.connect(c.destination);
            _rev = cv; return _rev;
        }

        // Soft music-box chime — pure sine, gentle attack, long decay
        function chime(freq, vol, t0) {
            vol = vol || 0.012; t0 = t0 || 0; // Much lower volume for absolute calmness
            const c = getAC(), t = c.currentTime + t0;
            const o = c.createOscillator(), g = c.createGain();
            o.type = 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.08); // softer attack removes harsh click
            g.gain.exponentialRampToValueAtTime(0.0001, t + 4); // super soft slow decay
            o.connect(g); g.connect(c.destination);
            try { g.connect(getRev()); } catch (e) { }
            o.start(t); o.stop(t + 4.5);
        }

        // ── SFX: Box open — soft rising chord ──
        function sfxOpen() {
            [261.63, 329.63, 392, 523.25].forEach((f, i) => chime(f, 0.015, i * 0.15));
        }

        // ── SFX: Card click — two soft notes ──
        function sfxCardOpen() {
            chime(523.25, 0.012, 0);
            chime(659.25, 0.01, 0.1);
        }

        // ── SFX: Card close — single soft low note ──
        function sfxCardClose() {
            chime(392, 0.012, 0);
        }

        // ── Music Box Melody — Slow, dreamy romantic sequence ──
        const MELODY = [
            // Dreamy descending and rising arpeggios
            [523.25, 1], // C5
            [659.25, 1], // E5
            [783.99, 2], // G5
            [659.25, 1], // E5
            [880.00, 1], // A5
            [783.99, 2], // G5
            [698.46, 1], // F5
            [659.25, 1], // E5
            [587.33, 2], // D5
            [523.25, 1], // C5
            [659.25, 1], // E5
            [587.33, 4], // D5
            [0, 2],      // rest

            [523.25, 1], // C5
            [659.25, 1], // E5
            [783.99, 2], // G5
            [659.25, 1], // E5
            [1046.50,1], // C6
            [987.77, 2], // B5
            [880.00, 1], // A5
            [783.99, 1], // G5
            [698.46, 2], // F5
            [659.25, 1], // E5
            [587.33, 1], // D5
            [523.25, 4], // C5
            [0, 3],      // rest
        ];

        let melodyPlaying = false;
        let melodyTimeout = null;

        function playMelody() {
            if (melodyPlaying) return;
            melodyPlaying = true;
            const bpm = 75; // very relaxed pace
            const beatMs = (60 / bpm) * 1000;
            let noteIdx = 0;

            function playNext() {
                if (!melodyPlaying) return;
                const [freq, beats] = MELODY[noteIdx % MELODY.length];
                if (freq > 0) chime(freq, 0.012, 0); // extra soft volume
                noteIdx++;
                melodyTimeout = setTimeout(playNext, beats * beatMs);
            }
            playNext();
        }

        function stopMelody() {
            melodyPlaying = false;
            if (melodyTimeout) clearTimeout(melodyTimeout);
        }

        // ═══ STATE ═══
        let isOpen = false;

        // toggle box open/close — ignore clicks on cards
        box.addEventListener('click', e => {
            if (e.target.closest('.card')) return;
            isOpen = !isOpen;
            box.classList.toggle('open', isOpen);
            hint.textContent = isOpen ? 'click a card' : 'open';
            if (isOpen) {
                sfxOpen();
                startNotes();
                setTimeout(playMelody, 600);
            } else {
                stopMelody();
            }
        });

        // expand card
        stage.addEventListener('click', e => {
            const card = e.target.closest('.card');
            if (!card || !isOpen) return;
            e.stopPropagation();
            sfxCardOpen();
            fullTxt.textContent = card.dataset.full;
            overlay.classList.add('active');
            box.classList.add('blurred');
            hint.classList.add('blurred');
        });

        function closeOverlay() {
            sfxCardClose();
            overlay.classList.remove('active');
            box.classList.remove('blurred');
            hint.classList.remove('blurred');
        }

        closeBtn.addEventListener('click', closeOverlay);
        overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });
    </script>

</body>

</html>
