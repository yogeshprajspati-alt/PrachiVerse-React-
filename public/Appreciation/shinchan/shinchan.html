<title>Prachi's Special Day</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(160deg, #87CEEB 0%, #b0e0ff 60%, #d4f1ff 100%);
    min-height: 100vh;
    font-family: "Baloo 2", cursive;
    overflow: hidden;
  }
  .cloud {
    position: fixed; font-size: 3.5rem; opacity: 0.85;
    animation: cloudMove linear infinite; z-index: 2;
  }
  @keyframes cloudMove {
    from { transform: translateX(-200px); }
    to   { transform: translateX(110vw); }
  }
  .title {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 100; color: #fff; font-size: 2rem; font-weight: 900;
    text-shadow: 2px 2px 0 #ff6fa8, 4px 4px 0 #c0006b;
    white-space: nowrap;
    animation: bounce 1.6s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-8px); }
  }
  .ground {
    position: fixed; bottom: 0; left: 0; right: 0; height: 110px;
    background: linear-gradient(180deg, #6ecb3c 0%, #3a8c10 100%);
    border-top: 5px solid #2d6a0a; z-index: 30;
  }
  .shinchan-wrap {
    position: fixed; bottom: 108px; z-index: 50;
    animation: walk 5s linear infinite;
  }
  @keyframes walk {
    0%   { left: -140px; }
    100% { left: 110vw; }
  }
  .shinchan-wrap img { width: 120px; height: 120px; object-fit: contain; display: block; }
  .msg-area {
    position: fixed; top: 80px; left: 0; right: 0; bottom: 115px;
    z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    gap: 14px; padding: 10px 24px; overflow: hidden; pointer-events: none;
  }
  .bubble {
    background: #fff; border-radius: 22px 22px 22px 6px;
    padding: 13px 22px; font-size: 1.1rem; font-weight: 700; color: #333;
    border: 2.5px solid #ff6fa8; box-shadow: 4px 4px 0 #ff6fa8;
    max-width: 75%; text-align: center;
    opacity: 0; transform: scale(0.5) rotate(-4deg);
    animation: popIn 0.5s cubic-bezier(0.68,-0.55,0.27,1.55) forwards,
               fadeOut 0.5s ease 3.6s forwards;
  }
  @keyframes popIn { to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }
</style>
